name: CI using MATLAB

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  schedule:
    - cron: '0 3 * * 1' # schedule a weekly-ish build

jobs:

  job-check-project:
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025bu5
          cache: true
          products: |
            Simulink
            Simscape
            Simscape_Fluids
            Simscape_Electrical
            Stateflow
            Control_System_Toolbox
            Simulink_Control_Design
            System_Identification_Toolbox

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool AllTest;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="98" height="98" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Left H-Bridge ===== -->
    <line x1="12" y1="12" x2="32" y2="12"/>
    <line x1="12" y1="62" x2="32" y2="62"/>
    <line x1="16" y1="12" x2="16" y2="62"/>
    <line x1="28" y1="12" x2="28" y2="62"/>

    <!-- Left leg switches -->
    <rect x="14" y="20" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="14" y="45" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Right leg switches -->
    <rect x="26" y="20" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="26" y="45" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Left bridge to transformer (straight horizontal) -->
    <line x1="16" y1="30" x2="38" y2="30"/>
    <line x1="28" y1="45" x2="38" y2="45"/>

    <!-- ===== Transformer ===== -->
    <path d="M 38,30 C 42,30 42,35 38,35 C 42,35 42,40 38,40 C 42,40 42,45 38,45"/>
    <path d="M 62,30 C 58,30 58,35 62,35 C 58,35 58,40 62,40 C 58,40 58,45 62,45"/>
    <line x1="48" y1="27" x2="48" y2="48" stroke-width="1.5"/>
    <line x1="52" y1="27" x2="52" y2="48" stroke-width="1.5"/>

    <!-- Transformer to right bridge (straight horizontal) -->
    <line x1="62" y1="30" x2="72" y2="30"/>
    <line x1="62" y1="45" x2="84" y2="45"/>

    <!-- ===== Right H-Bridge ===== -->
    <line x1="68" y1="12" x2="88" y2="12"/>
    <line x1="68" y1="62" x2="88" y2="62"/>
    <line x1="72" y1="12" x2="72" y2="62"/>
    <line x1="84" y1="12" x2="84" y2="62"/>

    <!-- Left leg switches -->
    <rect x="70" y="20" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="70" y="45" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Right leg switches -->
    <rect x="82" y="20" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="82" y="45" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- ===== Control Layer ===== -->
    <line x1="10" y1="68" x2="90" y2="68" stroke-dasharray="3,2"/>
    <rect x="30" y="74" width="40" height="16" rx="2" ry="2"/>

    <!-- Control arrows -->
    <line x1="40" y1="74" x2="40" y2="65"/>
    <polygon points="38,67 40,63 42,67" fill="#1A56C4" stroke="none"/>
    <line x1="60" y1="74" x2="60" y2="65"/>
    <polygon points="58,67 60,63 62,67" fill="#1A56C4" stroke="none"/>

    <!-- Control input stub -->
    <line x1="3" y1="82" x2="30" y2="82" stroke-width="1.5"/>

    <!-- DC port stubs -->
    <line x1="3" y1="12" x2="12" y2="12" stroke-width="1.5"/>
    <line x1="3" y1="62" x2="12" y2="62" stroke-width="1.5"/>
    <line x1="88" y1="12" x2="97" y2="12" stroke-width="1.5"/>
    <line x1="88" y1="62" x2="97" y2="62" stroke-width="1.5"/>
  </g>

  <!-- Labels -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="6" fill="#1A56C4" text-anchor="middle">CTRL</text>
  <g font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" font-weight="bold">
    <text x="5" y="10">+</text>
    <text x="5" y="66">&#x2212;</text>
    <text x="93" y="10">+</text>
    <text x="93" y="66">&#x2212;</text>
    <text x="5" y="80">d</text>
  </g>
</svg>

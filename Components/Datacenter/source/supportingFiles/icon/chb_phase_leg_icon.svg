<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="78" height="98" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Module 1 (Top H-Bridge) ===== -->
    <line x1="18" y1="10" x2="50" y2="10"/>
    <line x1="18" y1="42" x2="50" y2="42"/>
    <line x1="24" y1="10" x2="24" y2="42"/>
    <line x1="44" y1="10" x2="44" y2="42"/>

    <!-- Switches -->
    <rect x="22" y="15" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="22" y="30" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="42" y="15" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="42" y="30" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Module 1 AC output -->
    <line x1="24" y1="26" x2="60" y2="26"/>

    <!-- Module 1 DC stubs -->
    <line x1="4" y1="10" x2="18" y2="10" stroke-width="1.5"/>
    <line x1="4" y1="42" x2="18" y2="42" stroke-width="1.5"/>

    <!-- ===== Module 2 (Bottom H-Bridge) ===== -->
    <line x1="18" y1="56" x2="50" y2="56"/>
    <line x1="18" y1="88" x2="50" y2="88"/>
    <line x1="24" y1="56" x2="24" y2="88"/>
    <line x1="44" y1="56" x2="44" y2="88"/>

    <!-- Switches -->
    <rect x="22" y="61" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="22" y="76" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="42" y="61" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="42" y="76" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Module 2 AC output -->
    <line x1="24" y1="72" x2="60" y2="72"/>

    <!-- Module 2 DC stubs -->
    <line x1="4" y1="56" x2="18" y2="56" stroke-width="1.5"/>
    <line x1="4" y1="88" x2="18" y2="88" stroke-width="1.5"/>

    <!-- Series connection -->
    <line x1="60" y1="26" x2="60" y2="72"/>
    <circle cx="60" cy="26" r="1.5" fill="#1A56C4" stroke="none"/>
    <circle cx="60" cy="72" r="1.5" fill="#1A56C4" stroke="none"/>

    <!-- AC output stubs -->
    <line x1="60" y1="26" x2="76" y2="26" stroke-width="1.5"/>
    <line x1="60" y1="72" x2="76" y2="72" stroke-width="1.5"/>
  </g>

  <!-- Port labels -->
  <g font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" font-weight="bold">
    <text x="6" y="8">+</text>
    <text x="6" y="46">&#x2212;</text>
    <text x="6" y="54">+</text>
    <text x="6" y="92">&#x2212;</text>
    <text x="72" y="24">AC+</text>
    <text x="72" y="76">AC&#x2212;</text>
  </g>

  <!-- Block label -->
  <text x="40" y="97" font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" text-anchor="middle">CHB</text>
</svg>

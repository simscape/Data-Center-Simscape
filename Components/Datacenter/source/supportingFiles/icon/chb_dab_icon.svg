<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 70" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="128" height="68" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== H-Bridge (Left) ===== -->
    <line x1="10" y1="10" x2="26" y2="10"/>
    <line x1="10" y1="60" x2="26" y2="60"/>
    <line x1="13" y1="10" x2="13" y2="60"/>
    <line x1="23" y1="10" x2="23" y2="60"/>

    <!-- Switches -->
    <rect x="11" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="11" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="21" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="21" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- H-Bridge AC to DAB DC connection -->
    <line x1="13" y1="35" x2="30" y2="35"/>
    <line x1="30" y1="35" x2="30" y2="10"/>
    <line x1="30" y1="10" x2="40" y2="10"/>
    <line x1="23" y1="35" x2="33" y2="35"/>
    <line x1="33" y1="35" x2="33" y2="60"/>
    <line x1="33" y1="60" x2="40" y2="60"/>

    <!-- ===== DAB Left H-Bridge ===== -->
    <line x1="40" y1="10" x2="56" y2="10"/>
    <line x1="40" y1="60" x2="56" y2="60"/>
    <line x1="43" y1="10" x2="43" y2="60"/>
    <line x1="53" y1="10" x2="53" y2="60"/>

    <!-- Switches -->
    <rect x="41" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="41" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- DAB left to transformer (straight horizontal) -->
    <line x1="43" y1="28" x2="60" y2="28"/>
    <line x1="53" y1="43" x2="60" y2="43"/>

    <!-- ===== Transformer ===== -->
    <path d="M 60,28 C 63,28 63,33 60,33 C 63,33 63,38 60,38 C 63,38 63,43 60,43"/>
    <path d="M 76,28 C 73,28 73,33 76,33 C 73,33 73,38 76,38 C 73,38 73,43 76,43"/>
    <line x1="66" y1="25" x2="66" y2="46" stroke-width="1.5"/>
    <line x1="70" y1="25" x2="70" y2="46" stroke-width="1.5"/>

    <!-- Transformer to right bridge (straight horizontal) -->
    <line x1="76" y1="28" x2="83" y2="28"/>
    <line x1="76" y1="43" x2="93" y2="43"/>

    <!-- ===== DAB Right H-Bridge ===== -->
    <line x1="80" y1="10" x2="96" y2="10"/>
    <line x1="80" y1="60" x2="96" y2="60"/>
    <line x1="83" y1="10" x2="83" y2="60"/>
    <line x1="93" y1="10" x2="93" y2="60"/>

    <!-- Switches -->
    <rect x="81" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="81" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="91" y="17" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="91" y="42" width="5" height="8" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- DC port stubs -->
    <line x1="3" y1="10" x2="10" y2="10" stroke-width="1.5"/>
    <line x1="3" y1="60" x2="10" y2="60" stroke-width="1.5"/>
    <line x1="96" y1="10" x2="127" y2="10" stroke-width="1.5"/>
    <line x1="96" y1="60" x2="127" y2="60" stroke-width="1.5"/>
  </g>

  <!-- Port labels -->
  <g font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" font-weight="bold">
    <text x="4" y="8">+</text>
    <text x="4" y="65">&#x2212;</text>
    <text x="123" y="8">+</text>
    <text x="123" y="65">&#x2212;</text>
  </g>

  <!-- Block label -->
  <text x="65" y="67" font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" text-anchor="middle">CHB-DAB</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="98" height="68" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Left H-Bridge ===== -->
    <line x1="12" y1="10" x2="32" y2="10"/>
    <line x1="12" y1="60" x2="32" y2="60"/>
    <line x1="16" y1="10" x2="16" y2="60"/>
    <line x1="28" y1="10" x2="28" y2="60"/>

    <!-- Left leg switches -->
    <rect x="14" y="18" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="14" y="43" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <!-- Right leg switches -->
    <rect x="26" y="18" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="26" y="43" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Left bridge to transformer (straight horizontal) -->
    <line x1="16" y1="28" x2="38" y2="28"/>
    <line x1="28" y1="43" x2="38" y2="43"/>

    <!-- ===== Transformer ===== -->
    <path d="M 38,28 C 42,28 42,33 38,33 C 42,33 42,38 38,38 C 42,38 42,43 38,43"/>
    <path d="M 62,28 C 58,28 58,33 62,33 C 58,33 58,38 62,38 C 58,38 58,43 62,43"/>
    <line x1="48" y1="25" x2="48" y2="46" stroke-width="1.5"/>
    <line x1="52" y1="25" x2="52" y2="46" stroke-width="1.5"/>

    <!-- Transformer to right bridge (straight horizontal) -->
    <line x1="62" y1="28" x2="72" y2="28"/>
    <line x1="62" y1="43" x2="84" y2="43"/>

    <!-- ===== Right H-Bridge ===== -->
    <line x1="68" y1="10" x2="88" y2="10"/>
    <line x1="68" y1="60" x2="88" y2="60"/>
    <line x1="72" y1="10" x2="72" y2="60"/>
    <line x1="84" y1="10" x2="84" y2="60"/>

    <!-- Left leg switches -->
    <rect x="70" y="18" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="70" y="43" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <!-- Right leg switches -->
    <rect x="82" y="18" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="82" y="43" width="5" height="9" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- DC port stubs -->
    <line x1="3" y1="10" x2="12" y2="10" stroke-width="1.5"/>
    <line x1="3" y1="60" x2="12" y2="60" stroke-width="1.5"/>
    <line x1="88" y1="10" x2="97" y2="10" stroke-width="1.5"/>
    <line x1="88" y1="60" x2="97" y2="60" stroke-width="1.5"/>
  </g>

  <!-- Port labels -->
  <g font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" font-weight="bold">
    <text x="5" y="8">+</text>
    <text x="5" y="65">&#x2212;</text>
    <text x="93" y="8">+</text>
    <text x="93" y="65">&#x2212;</text>
  </g>

  <!-- Block label -->
  <text x="50" y="67" font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" text-anchor="middle">DAB</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="78" height="58" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- H-Bridge top rail -->
    <line x1="20" y1="12" x2="60" y2="12"/>
    <!-- H-Bridge bottom rail -->
    <line x1="20" y1="48" x2="60" y2="48"/>
    <!-- Left leg -->
    <line x1="28" y1="12" x2="28" y2="48"/>
    <!-- Right leg -->
    <line x1="52" y1="12" x2="52" y2="48"/>

    <!-- Switches (4 IGBTs represented as filled rectangles) -->
    <rect x="25" y="17" width="6" height="9" fill="#1A56C4" fill-opacity="0.2"/>
    <rect x="25" y="34" width="6" height="9" fill="#1A56C4" fill-opacity="0.2"/>
    <rect x="49" y="17" width="6" height="9" fill="#1A56C4" fill-opacity="0.2"/>
    <rect x="49" y="34" width="6" height="9" fill="#1A56C4" fill-opacity="0.2"/>

    <!-- AC midpoint connections -->
    <line x1="28" y1="30" x2="14" y2="30"/>
    <line x1="52" y1="30" x2="66" y2="30"/>

    <!-- DC bus stubs -->
    <line x1="40" y1="12" x2="40" y2="4" stroke-width="1.5"/>
    <line x1="40" y1="48" x2="40" y2="56" stroke-width="1.5"/>

    <!-- AC port stubs -->
    <line x1="14" y1="30" x2="4" y2="30" stroke-width="1.5"/>
    <line x1="66" y1="30" x2="76" y2="30" stroke-width="1.5"/>
  </g>

  <!-- Port labels -->
  <g font-family="Arial, sans-serif" font-size="6" fill="#1A56C4" font-weight="bold">
    <text x="36" y="4" text-anchor="middle">DC+</text>
    <text x="36" y="58" text-anchor="middle">DC&#x2212;</text>
    <text x="5" y="27">AC+</text>
    <text x="63" y="27">AC&#x2212;</text>
  </g>

  <!-- Block label -->
  <text x="40" y="31" font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" text-anchor="middle" font-style="italic">H</text>
</svg>

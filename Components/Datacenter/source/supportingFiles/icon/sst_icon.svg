<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" preserveAspectRatio="xMidYMid meet">
  <!-- Outer border -->
  <rect x="1" y="1" width="138" height="98" rx="4" ry="4" fill="#FFFFFF" stroke="#1A56C4" stroke-width="1.5"/>

  <g fill="none" stroke="#1A56C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== CHB Stage (Left) - Stacked H-bridges ===== -->
    <!-- Module 1 (Top) -->
    <line x1="12" y1="8" x2="28" y2="8"/>
    <line x1="12" y1="30" x2="28" y2="30"/>
    <line x1="15" y1="8" x2="15" y2="30"/>
    <line x1="25" y1="8" x2="25" y2="30"/>
    <rect x="13" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="13" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Module 2 (Middle) -->
    <line x1="12" y1="36" x2="28" y2="36"/>
    <line x1="12" y1="58" x2="28" y2="58"/>
    <line x1="15" y1="36" x2="15" y2="58"/>
    <line x1="25" y1="36" x2="25" y2="58"/>
    <rect x="13" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="13" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Module 3 (Bottom) -->
    <line x1="12" y1="64" x2="28" y2="64"/>
    <line x1="12" y1="86" x2="28" y2="86"/>
    <line x1="15" y1="64" x2="15" y2="86"/>
    <line x1="25" y1="64" x2="25" y2="86"/>
    <rect x="13" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="13" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="23" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>

    <!-- Series AC connection (CHB output) -->
    <line x1="25" y1="19" x2="34" y2="19"/>
    <line x1="34" y1="19" x2="34" y2="30"/>
    <line x1="25" y1="47" x2="34" y2="47"/>
    <line x1="34" y1="30" x2="34" y2="36"/>
    <line x1="34" y1="47" x2="34" y2="58"/>
    <line x1="25" y1="75" x2="34" y2="75"/>
    <line x1="34" y1="58" x2="34" y2="64"/>
    <line x1="34" y1="75" x2="34" y2="86"/>

    <!-- ===== DAB Stages (Right side, 3 stacked) ===== -->
    <!-- DAB 1 (Top) -->
    <!-- Left H-bridge -->
    <line x1="42" y1="8" x2="56" y2="8"/>
    <line x1="42" y1="30" x2="56" y2="30"/>
    <line x1="45" y1="8" x2="45" y2="30"/>
    <line x1="53" y1="8" x2="53" y2="30"/>
    <rect x="43" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="43" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <!-- Transformer 1 -->
    <line x1="45" y1="15" x2="60" y2="15"/>
    <line x1="53" y1="23" x2="60" y2="23"/>
    <path d="M 60,15 C 63,15 63,18 60,18 C 63,18 63,21 60,21 C 63,21 63,24 60,24"/>
    <path d="M 76,15 C 73,15 73,18 76,18 C 73,18 73,21 76,21 C 73,21 73,24 76,24"/>
    <line x1="66" y1="13" x2="66" y2="26" stroke-width="1.2"/>
    <line x1="70" y1="13" x2="70" y2="26" stroke-width="1.2"/>
    <!-- Right H-bridge -->
    <line x1="80" y1="8" x2="94" y2="8"/>
    <line x1="80" y1="30" x2="94" y2="30"/>
    <line x1="83" y1="8" x2="83" y2="30"/>
    <line x1="91" y1="8" x2="91" y2="30"/>
    <rect x="81" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="81" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="12" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="21" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <line x1="76" y1="15" x2="83" y2="15"/>
    <line x1="76" y1="23" x2="91" y2="23"/>

    <!-- DAB 2 (Middle) -->
    <line x1="42" y1="36" x2="56" y2="36"/>
    <line x1="42" y1="58" x2="56" y2="58"/>
    <line x1="45" y1="36" x2="45" y2="58"/>
    <line x1="53" y1="36" x2="53" y2="58"/>
    <rect x="43" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="43" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <!-- Transformer 2 -->
    <line x1="45" y1="43" x2="60" y2="43"/>
    <line x1="53" y1="51" x2="60" y2="51"/>
    <path d="M 60,43 C 63,43 63,46 60,46 C 63,46 63,49 60,49 C 63,49 63,52 60,52"/>
    <path d="M 76,43 C 73,43 73,46 76,46 C 73,46 73,49 76,49 C 73,49 73,52 76,52"/>
    <line x1="66" y1="41" x2="66" y2="54" stroke-width="1.2"/>
    <line x1="70" y1="41" x2="70" y2="54" stroke-width="1.2"/>
    <!-- Right H-bridge -->
    <line x1="80" y1="36" x2="94" y2="36"/>
    <line x1="80" y1="58" x2="94" y2="58"/>
    <line x1="83" y1="36" x2="83" y2="58"/>
    <line x1="91" y1="36" x2="91" y2="58"/>
    <rect x="81" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="81" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="40" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="49" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <line x1="76" y1="43" x2="83" y2="43"/>
    <line x1="76" y1="51" x2="91" y2="51"/>

    <!-- DAB 3 (Bottom) -->
    <line x1="42" y1="64" x2="56" y2="64"/>
    <line x1="42" y1="86" x2="56" y2="86"/>
    <line x1="45" y1="64" x2="45" y2="86"/>
    <line x1="53" y1="64" x2="53" y2="86"/>
    <rect x="43" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="43" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="51" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <!-- Transformer 3 -->
    <line x1="45" y1="71" x2="60" y2="71"/>
    <line x1="53" y1="79" x2="60" y2="79"/>
    <path d="M 60,71 C 63,71 63,74 60,74 C 63,74 63,77 60,77 C 63,77 63,80 60,80"/>
    <path d="M 76,71 C 73,71 73,74 76,74 C 73,74 73,77 76,77 C 73,77 73,80 76,80"/>
    <line x1="66" y1="69" x2="66" y2="82" stroke-width="1.2"/>
    <line x1="70" y1="69" x2="70" y2="82" stroke-width="1.2"/>
    <!-- Right H-bridge -->
    <line x1="80" y1="64" x2="94" y2="64"/>
    <line x1="80" y1="86" x2="94" y2="86"/>
    <line x1="83" y1="64" x2="83" y2="86"/>
    <line x1="91" y1="64" x2="91" y2="86"/>
    <rect x="81" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="81" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="68" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <rect x="89" y="77" width="4" height="6" fill="#1A56C4" fill-opacity="0.15"/>
    <line x1="76" y1="71" x2="83" y2="71"/>
    <line x1="76" y1="79" x2="91" y2="79"/>

    <!-- DC output bus (parallel connection of DAB outputs) -->
    <line x1="94" y1="8" x2="100" y2="8"/>
    <line x1="100" y1="8" x2="100" y2="86"/>
    <line x1="94" y1="36" x2="100" y2="36"/>
    <line x1="94" y1="64" x2="100" y2="64"/>
    <line x1="94" y1="30" x2="104" y2="30"/>
    <line x1="104" y1="30" x2="104" y2="86"/>
    <line x1="94" y1="58" x2="104" y2="58"/>
    <line x1="94" y1="86" x2="104" y2="86"/>

    <!-- DC output stubs -->
    <line x1="100" y1="19" x2="137" y2="19" stroke-width="1.5"/>
    <line x1="104" y1="75" x2="137" y2="75" stroke-width="1.5"/>

    <!-- CHB DC connections to DAB inputs -->
    <line x1="28" y1="8" x2="42" y2="8"/>
    <line x1="28" y1="30" x2="42" y2="30"/>
    <line x1="28" y1="36" x2="42" y2="36"/>
    <line x1="28" y1="58" x2="42" y2="58"/>
    <line x1="28" y1="64" x2="42" y2="64"/>
    <line x1="28" y1="86" x2="42" y2="86"/>

    <!-- AC input stubs -->
    <line x1="3" y1="19" x2="15" y2="19" stroke-width="1.5"/>
    <line x1="3" y1="75" x2="15" y2="75" stroke-width="1.5"/>
  </g>

  <!-- Port labels -->
  <g font-family="Arial, sans-serif" font-size="5" fill="#1A56C4" font-weight="bold">
    <text x="5" y="17">AC</text>
    <text x="5" y="79">AC</text>
    <text x="130" y="17">DC+</text>
    <text x="130" y="79">DC&#x2212;</text>
  </g>

  <!-- Block label -->
  <text x="70" y="96" font-family="Arial, sans-serif" font-size="6" fill="#1A56C4" text-anchor="middle">SST</text>
</svg>
